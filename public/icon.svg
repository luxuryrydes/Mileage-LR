<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Gauge / Speed Arc -->
  <path d="M 120 330 A 150 150 0 0 1 392 330" fill="none" stroke="#38bdf8" stroke-width="14" stroke-dasharray="16 10" opacity="0.6"/>

  <!-- Truck Cab and Cargo Box -->
  <!-- Cargo Container -->
  <rect x="110" y="170" width="180" height="150" rx="14" fill="url(#truckGrad)"/>
  <!-- Decorative stripe on cargo -->
  <path d="M 110 240 L 290 240" stroke="#0284c7" stroke-width="8"/>
  <circle cx="150" cy="205" r="10" fill="#0284c7"/>
  <rect x="175" y="200" width="70" height="10" rx="4" fill="#0284c7"/>

  <!-- Cab Cabin -->
  <path d="M 296 200 L 350 200 C 375 200 395 220 398 245 L 406 285 C 408 298 398 320 380 320 L 296 320 Z" fill="url(#truckGrad)"/>
  <!-- Windshield -->
  <path d="M 308 214 L 348 214 C 362 214 372 226 374 240 L 378 260 L 308 260 Z" fill="#0284c7"/>
  <!-- Headlight -->
  <rect x="396" y="280" width="10" height="18" rx="4" fill="#facc15"/>

  <!-- Under-chassis shadow/bar -->
  <rect x="120" y="318" width="280" height="12" rx="6" fill="#0369a1"/>

  <!-- Wheels -->
  <!-- Back Wheel -->
  <circle cx="170" cy="340" r="38" fill="#1e293b"/>
  <circle cx="170" cy="340" r="20" fill="#94a3b8"/>
  <circle cx="170" cy="340" r="8" fill="#0284c7"/>

  <!-- Front Wheel -->
  <circle cx="346" cy="340" r="38" fill="#1e293b"/>
  <circle cx="346" cy="340" r="20" fill="#94a3b8"/>
  <circle cx="346" cy="340" r="8" fill="#0284c7"/>

  <!-- Text "MILEAGE SOFT" at bottom -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="3" fill="#ffffff" text-anchor="middle">MILEAGE SOFT</text>
  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5" fill="#bae6fd" text-anchor="middle">FLEET &amp; GPS TRACKER</text>
</svg>
